{% extends "bootstrap/base.html" %}
<!DOCTYPE html>
<html>
  <head>
    <title>Flask app</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared_achievements.css') }}">

    <script>
      (function() {
        "use strict";

        function copyToClipboard(elem) {
          var target = elem;

          // select the content
          var currentFocus = document.activeElement;

          target.focus();
          target.setSelectionRange(0, target.value.length);

          // copy the selection
          var succeed;

          try {
            succeed = document.execCommand("copy");
          } catch (e) {
            console.warn(e);

            succeed = false;
          }

          // Restore original focus
          if (currentFocus && typeof currentFocus.focus === "function") {
            currentFocus.focus();
          }

          if (succeed) {
            $(".copied").animate({ top: -25, opacity: 0 }, 700, function() {
              $(this).css({ top: 0, opacity: 1 });
            });
          }

          return succeed;
        }

        $("#copyButton, #copyTarget").on("click", function() {
          copyToClipboard(document.getElementById("copyTarget"));
        });
      })();
    </script>
  </head>
  <body>
    <header>
      <div class="container">
        
      </div>
    </header>
    <div class="container">
      {% block content %}
        <div class="input-group">
          <span class="input-group-addon hidden-xs linkname">
            <strong>{{code}}</strong>
          </span>
          <span id="copyButton" class="input-group-addon btn" title="Click to copy">
            <i class="fa fa-clipboard" aria-hidden="true"></i>
          </span>
          <input type="text" id="copyTarget" class="form-control" value="{{code}}">
          <span class="copied">Copied !</span>
        </div>      
      {% endblock %}
    </div>
  </body>
</html>
